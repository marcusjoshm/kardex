[project]
name = "kardex"
version = "2.0.0"
description = "A light SQLite database of what Joshua owns, with a small CLI. Peems is its interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kardex = "kardex.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kardex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
